# Runs the same application image at the local domain root using a separate database and volume.
services:
  wordpress:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: visibi
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:?Set WP_DB_PASSWORD in the private local env file}
      WORDPRESS_DB_NAME: visibi_v2
      VISIBI_SITE_URL: http://localhost:8082
    ports:
      - "8082:80"
    volumes:
      - visibi-cms_wp_data:/var/www/html
    networks:
      - visibi-cms_default

volumes:
  visibi-cms_wp_data:
    external: true

networks:
  visibi-cms_default:
    external: true
